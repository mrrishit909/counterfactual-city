    given: "the baseline scenario loaded"
    when: "the visitor changes the intervention date"
    then: "validated state updates, a real DiD/synthetic-control recomputation runs (or a traceable matched fixture is selected), the changed quantity is visibly explained, invalid dates are handled, and Reset Scenario restores baseline"
    behavior: "Change intervention date"
    owner: "data-ai-engineer (computation) + frontend-engineer (control, state)"
    verification: ["unit:estimator reference parity", "e2e:cty_intervention_date"]
    status: unstarted
    evidence_paths: []
