# THE COUNTERFACTUAL CITY, requirement contracts
# Source: Creative Engineering Atlas, dossier 02 (Build Book p.10) + executable contract (p.90), namespace CTY.
# Pattern follows CASCADIA's own specifications/REQUIREMENTS.yaml (11 rows: 6 interactions + 5 gates).

requirements:
  - id: CTY-INT-001
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-001; dossier p.10 control 1 (change intervention date > rebuild post-period > treatment graph)"
    given: "the baseline scenario loaded"
    when: "the visitor changes the intervention date"
    then: "validated state updates, a real DiD/synthetic-control recomputation runs (or a traceable matched fixture is selected), the changed quantity is visibly explained, invalid dates are handled, and Reset Scenario restores baseline"
    behavior: "Change intervention date"
    owner: "data-ai-engineer (computation) + frontend-engineer (control, state)"
    verification: ["unit:estimator reference parity", "e2e:cty_intervention_date"]
    status: independently verified
    evidence_paths: ["src/engine/ScenarioContext.tsx", "src/App.tsx", "src/engine/estimators.ts", "src/engine/estimators.test.ts", "e2e/smoke.spec.ts"]
    note: "First of the 6 controls wired fully end to end, per the build directive's own M4 guidance
    (verify one control's architecture before building the rest). A TypeScript port of the Python
    DiD estimator (src/engine/estimators.ts) is checked for numerical parity against 9 golden cases
    from the Python oracle (agreement to 1e-6, src/engine/estimators.test.ts) plus 4 boundary cases.
    The React control (src/App.tsx, via src/engine/ScenarioContext.tsx) updates validated scenario
    state on every slider change, recomputes a REAL DiD estimate (not a cosmetic change) on every
    change, visibly explains the changed quantity (pre/post means for both treated and control
    groups, not just the ATT number), and Reset Scenario restores baseline. Loading/error/ready
    states implemented (data-state attribute). Keyboard operability confirmed with a real Playwright
    e2e test driving ArrowLeft against the production build, not just a unit-level synthetic event
    (15/15 Vitest + 5/5 Playwright passing, tsc clean, oxlint clean). Not yet styled/art-directed
    (that is Stage 2, docs/VISUAL_REFERENCE_RESEARCH.md written, design-system docs pending).
    Independently verified (Stage 1 architecture review, verification/STAGE1_ARCHITECTURE_REVIEW.md):
    confirmed live that state ownership is single-source and async loading is StrictMode-safe.
    Stage 3: migrated out of the flat Lab panel into its own cinematic chapter 2 ('treatment',
    src/scenes/Chapter2Treatment.tsx), with a scroll-scrubbed camera reframe to the chosen treated
    zone and its own e2e coverage (e2e/chapter2.spec.ts).
    Stage 4 (lab integration): the DiD result itself (previously a standalone 'Lab' <main> section
    at the very bottom of the page, disconnected from this control) now lives inside chapter 2 too
    (src/scenes/DiDResultPanel.tsx), directly satisfying this row's own 'the changed quantity is
    visibly explained' clause at the point of interaction, not several chapters away. The standalone
    Lab section is removed entirely (App.tsx no longer exports a Lab component); its only other
    content (a page <h1> duplicating the intro's own, a synthetic-panel disclaimer paragraph
    duplicating chapter 6's own methodology prose almost verbatim) was redundant presentation,
    confirmed nothing depended on it before removal. A real a11y regression surfaced removing it
    (axe-core's landmark-one-main rule failed: nothing in the document was a <main> landmark once
    the Lab's own <main> was gone) and was fixed by making IntroSequence's own children wrapper the
    document's <main> landmark instead."
  - id: CTY-INT-002
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-002; dossier p.10 control 2 (select treatment area > update group > map)"
    given: "the baseline scenario loaded"
    when: "the visitor selects a treated zone"
    then: "validated state updates, a real recomputation runs against the new treated group, the changed quantity is visibly explained, invalid/empty selections are handled, and Reset Scenario restores baseline"
    behavior: "select treated zone"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:treated-group reassignment", "e2e:cty_treated_zone"]
    status: independently verified
    evidence_paths: ["src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts"]
    note: "A real select control (#treated-zone) updates scenario.treatedZone, which both diffInDiff
    and syntheticControl recompute against immediately. Verified live in a real browser (real
    recomputation confirmed via a direct DOM-level before/after ATT comparison) and with a
    Playwright e2e test using selectOption (native <select> does not respond to synthetic
    keyboard events in headless Chromium, the same tooling gap CASCADIA's own suite documents;
    selectOption drives the browser's real selection model, not a React-level hack). Reset Scenario
    restores baseline. Independently verified (Stage 1 architecture review,
    verification/STAGE1_ARCHITECTURE_REVIEW.md): confirmed live this control drives a real
    recomputation. Stage 3: migrated into chapter 2 alongside CTY-INT-001 (same file, same e2e
    suite); changing it reframes chapter 2's own camera to the newly selected zone, confirmed live
    and with a dedicated test asserting the correct zone's data-treated attribute flips.
    Stage 4: shares DiDResultPanel.tsx with CTY-INT-001 (see that row's own note); the standalone
    Lab section this control's result used to live in, far below the control itself, is gone."
