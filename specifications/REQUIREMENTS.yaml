  - id: CTY-MATH-001
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, five release gates"
    given: "the DiD/synthetic-control/placebo implementation"
    when: "math-validation runs"
    then: "an independent numerical baseline agrees within a stated tolerance, including boundary and infeasible cases (zero/empty data, invalid parameter, missing fixture, interrupted computation)"
    behavior: "Independent numerical baseline, boundary and infeasible-case agreement."
    owner: "data-ai-engineer (build) + qa-engineer (independent check)"
    verification: ["unit:reference-model parity", "unit:boundary/infeasible cases"]
    status: implemented
    evidence_paths: ["analysis/models/estimators.py", "analysis/validation/test_estimators.py"]
    note: "25/25 pytest passing (python3 -m pytest analysis/validation/ -v): ground-truth ATT
    recovery within a declared tolerance for DiD and synthetic control across all 3 outcomes, an
    independent cross-check (closed-form cell-means DiD vs. an OLS regression estimator, agreeing to
    1e-6), a zero-noise near-exact recovery sanity check, placebo-test internal consistency,
    pretrend-diagnostic pass/fail behavior (both on the by-construction-parallel panel and on a
    deliberately broken one), and 11 boundary/infeasible cases (empty panel, unknown outcome/zone,
    out-of-range intervention day, empty control pool, insufficient donor pool, non-convex weights,
    wrong weight count, insufficient placebo units, insufficient pre-period observations for a
    trend fit). The synthetic-control donor-weight solver was switched from SLSQP to an augmented
    NNLS relaxation after SLSQP reported spurious non-convergence on this panel's near-collinear
    donor matrix (a real, reproduced failure, not assumed); NNLS is an active-set method with a
    convergence guarantee and recovered the same ground truth. Not yet independently verified by a
    separate reviewer."
