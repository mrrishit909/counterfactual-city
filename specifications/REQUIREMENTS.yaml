# THE COUNTERFACTUAL CITY, requirement contracts
# Source: Creative Engineering Atlas, dossier 02 (Build Book p.10) + executable contract (p.90), namespace CTY.
# Pattern follows CASCADIA's own specifications/REQUIREMENTS.yaml (11 rows: 6 interactions + 5 gates).

requirements:
  - id: CTY-INT-001
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-001; dossier p.10 control 1 (change intervention date > rebuild post-period > treatment graph)"
    given: "the baseline scenario loaded"
    when: "the visitor changes the intervention date"
    then: "validated state updates, a real DiD/synthetic-control recomputation runs (or a traceable matched fixture is selected), the changed quantity is visibly explained, invalid dates are handled, and Reset Scenario restores baseline"
    behavior: "Change intervention date"
    owner: "data-ai-engineer (computation) + frontend-engineer (control, state)"
    verification: ["unit:estimator reference parity", "e2e:cty_intervention_date"]
    status: independently verified
    evidence_paths: ["src/engine/ScenarioContext.tsx", "src/App.tsx", "src/engine/estimators.ts", "src/engine/estimators.test.ts", "e2e/smoke.spec.ts"]
    note: "First of the 6 controls wired fully end to end, per the build directive's own M4 guidance
    (verify one control's architecture before building the rest). A TypeScript port of the Python
    DiD estimator (src/engine/estimators.ts) is checked for numerical parity against 9 golden cases
    from the Python oracle (agreement to 1e-6, src/engine/estimators.test.ts) plus 4 boundary cases.
    The React control (src/App.tsx, via src/engine/ScenarioContext.tsx) updates validated scenario
    state on every slider change, recomputes a REAL DiD estimate (not a cosmetic change) on every
    change, visibly explains the changed quantity (pre/post means for both treated and control
    groups, not just the ATT number), and Reset Scenario restores baseline. Loading/error/ready
    states implemented (data-state attribute). Keyboard operability confirmed with a real Playwright
    e2e test driving ArrowLeft against the production build, not just a unit-level synthetic event
    (15/15 Vitest + 5/5 Playwright passing, tsc clean, oxlint clean). Not yet styled/art-directed
    (that is Stage 2, docs/VISUAL_REFERENCE_RESEARCH.md written, design-system docs pending).
    Independently verified (Stage 1 architecture review, verification/STAGE1_ARCHITECTURE_REVIEW.md):
    confirmed live that state ownership is single-source and async loading is StrictMode-safe.
    Stage 3: migrated out of the flat Lab panel into its own cinematic chapter 2 ('treatment',
    src/scenes/Chapter2Treatment.tsx), with a scroll-scrubbed camera reframe to the chosen treated
    zone and its own e2e coverage (e2e/chapter2.spec.ts, 8/8 passing). Still shares the same
    ScenarioContext as the lab, confirmed live that a chapter-2 change is reflected in the lab's
    own result further down the page."
