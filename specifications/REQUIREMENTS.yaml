    verification: ["unit:donor-pool re-estimation", "e2e:cty_control_pool"]
    status: independently verified
    evidence_paths: ["src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts", "LIMITATIONS.md"]
    note: "A checkbox grid (one per non-treated zone) drives scenario.controlPool, an explicit
    allow-list (empty = every non-treated zone; checking any zone switches to using only the
    checked zones), disclosed in the control's own hint text and in LIMITATIONS.md. Both diffInDiff
    and syntheticControl recompute against the resolved pool. Verified with keyboard-reachable
    checkboxes, a real-browser before/after ATT check, a Playwright test covering check/uncheck
    round-trip back to the 'use all zones' baseline, and a dedicated touch-emulated-context test
    (hasTouch: true) confirming tap operability. Independently verified (Stage 1 architecture
    review, verification/STAGE1_ARCHITECTURE_REVIEW.md).
    Stage 3: migrated into chapter 3 ('matched controls', src/scenes/Chapter3MatchedControls.tsx),
    with a real comparative tie-in to the shared city visualization: every zone in the current
    control pool renders blue on chapter 3's own stage, the treated zone red, confirmed live and
