# THE COUNTERFACTUAL CITY, requirement contracts
# Source: Creative Engineering Atlas, dossier 02 (Build Book p.10) + executable contract (p.90), namespace CTY.
# Pattern follows CASCADIA's own specifications/REQUIREMENTS.yaml (11 rows: 6 interactions + 5 gates).

requirements:
  - id: CTY-INT-001
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-001; dossier p.10 control 1 (change intervention date > rebuild post-period > treatment graph)"
    given: "the baseline scenario loaded"
    when: "the visitor changes the intervention date"
    then: "validated state updates, a real DiD/synthetic-control recomputation runs (or a traceable matched fixture is selected), the changed quantity is visibly explained, invalid dates are handled, and Reset Scenario restores baseline"
    behavior: "Change intervention date"
    owner: "data-ai-engineer (computation) + frontend-engineer (control, state)"
    verification: ["unit:estimator reference parity", "e2e:cty_intervention_date"]
    status: implemented
    evidence_paths: ["src/engine/ScenarioContext.tsx", "src/App.tsx", "src/engine/estimators.ts", "src/engine/estimators.test.ts", "e2e/smoke.spec.ts"]
    note: "First of the 6 controls wired fully end to end, per the build directive's own M4 guidance
    (verify one control's architecture before building the rest). A TypeScript port of the Python
    DiD estimator (src/engine/estimators.ts) is checked for numerical parity against 9 golden cases
    from the Python oracle (agreement to 1e-6, src/engine/estimators.test.ts) plus 4 boundary cases.
    The React control (src/App.tsx, via src/engine/ScenarioContext.tsx) updates validated scenario
    state on every slider change, recomputes a REAL DiD estimate (not a cosmetic change) on every
    change, visibly explains the changed quantity (pre/post means for both treated and control
    groups, not just the ATT number), and Reset Scenario restores baseline. Loading/error/ready
    states implemented (data-state attribute). Keyboard operability confirmed with a real Playwright
    e2e test driving ArrowLeft against the production build, not just a unit-level synthetic event
    (15/15 Vitest + 5/5 Playwright passing, tsc clean, oxlint clean). Not yet styled/art-directed
    (that is M5, docs/VISUAL_REFERENCE_RESEARCH.md and docs/DESIGN_SYSTEM.md are written/pending
    respectively) and not yet independently verified by a separate reviewer."
  - id: CTY-INT-002
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-002; dossier p.10 control 2 (select treatment area > update group > map)"
    given: "the baseline scenario loaded"
    when: "the visitor selects a treated zone"
    then: "validated state updates, a real recomputation runs against the new treated group, the changed quantity is visibly explained, invalid/empty selections are handled, and Reset Scenario restores baseline"
    behavior: "select treated zone"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:treated-group reassignment", "e2e:cty_treated_zone"]
    status: implemented
    evidence_paths: ["src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts"]
    note: "A real select control (#treated-zone) updates scenario.treatedZone, which both diffInDiff
    and syntheticControl recompute against immediately. Verified live in a real browser (real
    recomputation confirmed via a direct DOM-level before/after ATT comparison) and with a
    Playwright e2e test using selectOption (native <select> does not respond to synthetic
    keyboard events in headless Chromium, the same tooling gap CASCADIA's own suite documents;
    selectOption drives the browser's real selection model, not a React-level hack). Reset Scenario
    restores baseline. Not yet independently verified by a separate reviewer."
  - id: CTY-INT-003
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-003; dossier p.10 control 3 (choose control pool > re-estimate > comparative trajectories)"
    given: "the baseline scenario loaded"
    when: "the visitor picks a different control pool"
    then: "validated state updates, the estimator re-runs against the new donor pool, the changed quantity is visibly explained, an empty/insufficient pool is handled, and Reset Scenario restores baseline"
    behavior: "pick control pool"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:donor-pool re-estimation", "e2e:cty_control_pool"]
    status: implemented
    evidence_paths: ["src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts", "LIMITATIONS.md"]
    note: "A checkbox grid (one per non-treated zone) drives scenario.controlPool, an explicit
    allow-list (empty = every non-treated zone; checking any zone switches to using only the
    checked zones), disclosed in the control's own hint text and in LIMITATIONS.md. Both diffInDiff
    and syntheticControl recompute against the resolved pool. Verified with keyboard-reachable
    checkboxes, a real-browser before/after ATT check, a Playwright test covering check/uncheck
    round-trip back to the 'use all zones' baseline, and a dedicated touch-emulated-context test
    (hasTouch: true) confirming tap operability. Not yet independently verified by a separate
    reviewer."
  - id: CTY-INT-004
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-004; dossier p.10 control 4 (set weights > synthetic reconstruction > gap)"
    given: "the baseline scenario loaded"
    when: "the visitor adjusts synthetic-control donor weights"
    then: "validated state updates, the synthetic control is reconstructed with the new weights, the gap/outcome quantity is visibly explained, infeasible weights (e.g. not summing to 1, negative where disallowed) are handled, and Reset Scenario restores baseline"
    behavior: "adjust weights"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:synthetic-control reconstruction", "e2e:cty_adjust_weights"]
    status: implemented
    evidence_paths: ["src/engine/estimators.ts", "src/engine/syntheticControl.test.ts", "src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts", "LIMITATIONS.md"]
    note: "syntheticControl (CTY-MATH-001's TS port, parity-tested against the Python oracle) is
    wired to an 'Apply weights' staged-edit flow: per-donor sliders stage a pendingWeights vector,
    Apply validates it (non-negative, sums to 1 within WEIGHT_SUM_TOLERANCE) and, if invalid,
    surfaces a visible error (sc-error) rather than crashing or silently miscomputing, confirmed
    with a real Playwright test for both a valid exact-split application and an invalid
    does-not-sum-to-1 vector. A real bug was found and fixed during this build: the weights-array
    construction incorrectly skipped applying custom weights whenever the control pool was at its
    default 'use all zones' value (undefined), because the guard required a defined explicit pool;
    fixed by resolving the same effective pool the estimator defaults to internally before mapping
    weights onto it. A second, narrower finding (rapid synchronous edits across 20+ sliders can
    drop 1-2 updates) is disclosed in LIMITATIONS.md rather than silently worked around only in the
    test. Reset Scenario restores the original auto-fit. Not yet independently verified by a
    separate reviewer."
