    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-005; dossier p.10 control 5 (launch placebo > null distribution > evidence bands)"
    given: "the baseline scenario loaded"
    when: "the visitor runs a placebo test"
    then: "validated state updates, a real placebo/null-distribution computation runs, evidence bands are visibly explained, an interrupted/unavailable computation is handled, and Reset Scenario restores baseline"
    behavior: "run placebo"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:placebo null-distribution", "e2e:cty_run_placebo"]
    status: implemented
    evidence_paths: ["src/engine/estimators.ts", "src/engine/syntheticControl.test.ts", "src/App.tsx", "e2e/controls.spec.ts"]
    note: "runPlaceboTest (TS port, parity-tested against the Python oracle on rank/count) is wired
    to an explicit 'Run placebo test' button (the dossier frames this control as user-launched, not
    continuously auto-recomputed), showing the real effect's rank and permutation p-value among the
    full placebo distribution. An infeasible case (pool narrowed below the 2-unit minimum) shows a
    visible error (placebo-error) rather than crashing, verified live. Not yet independently
    verified by a separate reviewer."
