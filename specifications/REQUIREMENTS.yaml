    small-multiples trajectory comparison docs/ART_DIRECTION.md section 3 describes is not yet
    built; disclosed in LIMITATIONS.md, not silently dropped."
  - id: CTY-INT-004
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-004; dossier p.10 control 4 (set weights > synthetic reconstruction > gap)"
    given: "the baseline scenario loaded"
    when: "the visitor adjusts synthetic-control donor weights"
    then: "validated state updates, the synthetic control is reconstructed with the new weights, the gap/outcome quantity is visibly explained, infeasible weights (e.g. not summing to 1, negative where disallowed) are handled, and Reset Scenario restores baseline"
    behavior: "adjust weights"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:synthetic-control reconstruction", "e2e:cty_adjust_weights"]
    status: independently verified
    evidence_paths: ["src/engine/estimators.ts", "src/engine/syntheticControl.test.ts", "src/App.tsx", "src/engine/ScenarioContext.tsx", "e2e/controls.spec.ts", "LIMITATIONS.md"]
    note: "syntheticControl (CTY-MATH-001's TS port, parity-tested against the Python oracle) is
    wired to an 'Apply weights' staged-edit flow: per-donor sliders stage a pendingWeights vector,
    Apply validates it (non-negative, sums to 1 within WEIGHT_SUM_TOLERANCE) and, if invalid,
    surfaces a visible error (sc-error) rather than crashing or silently miscomputing, confirmed
    with a real Playwright test for both a valid exact-split application and an invalid
    does-not-sum-to-1 vector. A real bug was found and fixed during this build: the weights-array
    construction incorrectly skipped applying custom weights whenever the control pool was at its
    default 'use all zones' value (undefined), because the guard required a defined explicit pool;
    fixed by resolving the same effective pool the estimator defaults to internally before mapping
    weights onto it. A second, narrower finding (rapid synchronous edits across 20+ sliders can
    drop 1-2 updates) is disclosed in LIMITATIONS.md rather than silently worked around only in the
    test. Reset Scenario restores the original auto-fit.
    Independently verified (Stage 1 architecture review, verification/STAGE1_ARCHITECTURE_REVIEW.md):
    a fresh reviewer with no access to this session's own notes found and this session fixed a third
    bug, the slider thumb's rendered position visually desyncing from the applied weights after
    clearing custom weights (fixed with a weightsRevision remount key; regression test confirmed to
    fail against the pre-fix code before confirming it passes against the fix), and found the
    parity-test tolerance too loose to catch a real regression (tightened from 40 to 3 units,
    reflecting actual sub-1-unit achieved agreement). No other defects found; state ownership, async
    load safety, real-recomputation, and invalid-input handling all independently confirmed live.
    Stage 3: this control now lives in chapter 4 ('counterfactual', src/scenes/Chapter4Counterfactual.tsx),
    the dossier's own flagship 'two urban timelines diverge' interaction, moved verbatim out of the
    plain Lab panel into src/controls/DonorWeightsControl.tsx. Two live CityStage instances sit side
    by side (observed, fixed dossier red; synthetic counterfactual, colored/pulsing by the real
    sc.attPostMean via resultVisualEncoding.ts, never a placeholder), visually drawing apart on a
    scroll-scrubbed GSAP timeline as the visitor scrolls into the chapter. Two real layout bugs were
    found and fixed building this: (1) the flex-column sticky panel gave the two-stage split zero
    height because the donor-weights fieldset's own natural content height exceeded the viewport,
    starving the split of space (fixed by capping .flagship-controls to a scrollable max-height);
    (2) this chapter's own ScrollTrigger measured its start position before the async scenario fetch
    resolved, permanently trapping the scrub at its end state even when scrolled to the chapter's
    true top (fixed by adding scenario.treatedZone to the scene's dependency array, the same
    re-measurement trigger chapter 2's own identical pattern already relied on, confirmed via
    git-stash repro against the pre-fix code and a stable 6-of-6 full-suite rerun after).
    A second self-review found the dossier's own literal request ('two urban timelines diverge AS
    ESTIMATOR ASSUMPTIONS ARE MANIPULATED') was not actually built: the two stages only diverged on
    SCROLL, with no time axis and no redraw on weight changes. Fixed by adding
    src/scenes/TrajectoryChart.tsx, a hand-rolled SVG line chart plotting the treated zone's real
    observed series against the real synthetic-control reconstruction (derived from the estimator's
    own existing gapByDay field, already computed but never rendered) for the same days, with an
    intervention-day marker, redrawing whenever donor weights are reapplied. This is now the primary
    flagship interaction; the scroll-driven stage divergence remains as a secondary effect. Covered
    by e2e/chapter4.spec.ts (11 tests: layout, real gap readout with units, scroll divergence,
    trajectory chart renders a real path, trajectory chart redraws on weight change, weight-driven
    recompute, lab state sharing, reduced motion, 3-breakpoint responsiveness)."
  - id: CTY-INT-005
    project: "COUNTERFACTUAL CITY"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.90, CTY-INT-005; dossier p.10 control 5 (launch placebo > null distribution > evidence bands)"
    given: "the baseline scenario loaded"
    when: "the visitor runs a placebo test"
    then: "validated state updates, a real placebo/null-distribution computation runs, evidence bands are visibly explained, an interrupted/unavailable computation is handled, and Reset Scenario restores baseline"
    behavior: "run placebo"
    owner: "data-ai-engineer + frontend-engineer"
    verification: ["unit:placebo null-distribution", "e2e:cty_run_placebo"]
    status: independently verified
    evidence_paths: ["src/engine/estimators.ts", "src/engine/syntheticControl.test.ts", "src/App.tsx", "e2e/controls.spec.ts"]
    note: "runPlaceboTest (TS port, parity-tested against the Python oracle on rank/count) is wired
    to an explicit 'Run placebo test' button (the dossier frames this control as user-launched, not
    continuously auto-recomputed), showing the real effect's rank and permutation p-value among the
    full placebo distribution. An infeasible case (pool narrowed below the 2-unit minimum) shows a
    visible error (placebo-error) rather than crashing, verified live. Independently verified
    (Stage 1 architecture review, verification/STAGE1_ARCHITECTURE_REVIEW.md).
    Stage 3: this control now lives in chapter 5 ('diagnostics', src/scenes/Chapter5Diagnostics.tsx),
    the dossier's 'focused inspector' archetype, moved verbatim out of the plain Lab panel into
    src/controls/PlaceboControl.tsx, paired with the pretrend-diagnostic badge (also moved out of
    Lab, into the same chapter) so the chapter hosts both real diagnostics together rather than
    splitting them across the cinematic experience and the lab. The whole city grid stays in frame
    (no scroll-scrubbed camera), the same deliberate choice chapter 3 already made for its own
    archetype.
    Visual redesign: a first 'bordered inspector' treatment was correctly judged by an independent
    review as still too close to chapter 2's own skeleton to be its own archetype ('a different
    color on the same shape'). Rebuilt as an asymmetric split (smaller grid, wider console) with an
    inverted dark 'diagnostic console' panel, the one chapter on the page that isn't paper-on-ink.
    This row's own 'then' clause requires 'evidence bands are visibly explained,' which was
    previously satisfied only by text (a rank and a p-value); src/scenes/EvidenceBands.tsx makes the
    dossier's own literal 'null distribution > evidence bands' phrase real: every placebo unit's
    effect plotted on a shared axis (PlaceboResult.placeboEffects, already computed by
    runPlaceboTest but never rendered before this), the treated zone's own real effect highlighted.
    A real a11y regression was found and fixed building the dark panel: this entire project's
    src/index.css turned out to be leftover, never-reviewed Vite scaffold CSS silently coloring
    every chapter heading near-black (#08060d, indistinguishable from this app's own --ink on a
    light background, but a real contrast failure once a dark panel existed); the file's own
    @media (prefers-color-scheme: dark) block and h1/h2 color rule were removed, keeping only the
    structural rules (#root width, chapter 6's own <code> styling) this project's layout actually
    depends on. Also fixed: --accent-red itself (used for the chapter kicker label) was only 4.2:1
    against the new dark background, below WCAG AA's 4.5:1; reused the same lightened red already
    needed for error text on this background (7.4:1). Covered by e2e/chapter5.spec.ts (8 tests:
    layout, real rank/p-value, a real evidence-bands chart with one dot per placebo unit plus a
    distinct treated-zone dot, infeasible-pool error, shared state with other chapters,
    3-breakpoint responsiveness)."
